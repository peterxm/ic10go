name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: differential (extra seeds)
        run: go test ./pkg/ic10 -run 'TestDifferential' -count=1
